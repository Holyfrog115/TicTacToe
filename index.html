<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <button id="mode-switch">
            <svg id="dark-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
            <svg id="light-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
        </button>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div class="container">
            <div class="outer-part">
                <div class="top-part">
                    <div class="scores">
                        <div id="player-score"></div>
                        <div id="tie-score">Tie: 0</div>
                        <div id="bot-score"></div>
                    </div>
                    <div class="new-round-btn">
                        <button id="new-round">New Round</button>
                    </div>
                    <div class="btn-group">
                        <button id="change-name">Change Name</button>
                        <button id="change-side">Change Side</button>
                    </div>
                </div>
                <div class="game">
                </div>
            </div>
        </div>

        <dialog id="change-name-dialog">
            <form method="dialog">
                <h2>Change Name</h2>

                <div class="input-group">
                    <label for="user-name">Player name:</label>
                    <input type="text" name="userName" id="user-name" minlength="2" maxlength="6" pattern="[A-Za-z]+" title="Only letters are allowed" required autocomplete="off">
                </div>

                <div class="btn-group">
                    <button value="cancel" formmethod="dialog" type="button">Cancel</button>
                    <button value="confirm" type="submit">Confirm</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
