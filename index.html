<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div class="container">
            <div class="outer-part">
                <div class="top-part">
                    <div class="scores">
                        <div id="player-score"></div>
                        <div id="tie-score">Tie: 0</div>
                        <div id="bot-score"></div>
                    </div>
                    <div class="new-round-btn">
                        <button id="new-round">New Round</button>
                    </div>
                    <div class="btn-group">
                        <button id="change-name">Change Name</button>
                        <button id="change-side">Change Side</button>
                    </div>
                </div>
                <div class="game">
                </div>
            </div>
        </div>

        <dialog id="change-name-dialog">
            <form method="dialog">
                <h2>Change Name</h2>

                <div class="input-group">
                    <label for="user-name">Player name:</label>
                    <input type="text" name="userName" id="user-name" minlength="2" maxlength="6" pattern="[A-Za-z]+" title="Only letters are allowed" required autocomplete="off">
                </div>

                <div class="btn-group">
                    <button value="cancel" formmethod="dialog" type="button">Cancel</button>
                    <button value="confirm" type="submit">Confirm</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
